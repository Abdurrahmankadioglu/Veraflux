<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#050505" />
  <title>veraflux</title>
  <meta name="description" content="veraflux — connect with us on Instagram or WhatsApp." />
  <style>
    :root {
      --bg: #050505;
      --panel: #101010;
      --panel-2: #171717;
      --text: #ffffff;
      --muted: #b6b6b6;
      --line: rgba(255,255,255,.12);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top, rgba(255,255,255,.08), transparent 34rem),
        linear-gradient(180deg, #111 0%, var(--bg) 52%);
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .card {
      width: min(100%, 460px);
      background: rgba(10,10,10,.88);
      border: 1px solid var(--line);
      border-radius: 28px;
      padding: 34px 24px 26px;
      box-shadow: 0 24px 80px rgba(0,0,0,.45);
      backdrop-filter: blur(10px);
      text-align: center;
    }
    .logo-wrap {
      width: 150px;
      height: 150px;
      margin: 0 auto 18px;
      border-radius: 22px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.08);
      background: #000;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.03);
    }
    .logo-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    h1 {
      font-size: 1.7rem;
      margin: 0 0 7px;
      letter-spacing: .02em;
    }
    .tagline {
      margin: 0 auto 26px;
      max-width: 28ch;
      color: var(--muted);
      line-height: 1.55;
      font-size: .98rem;
    }
    .links {
      display: grid;
      gap: 12px;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      min-height: 58px;
      padding: 14px 18px;
      text-decoration: none;
      color: #fff;
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 16px;
      font-weight: 700;
      letter-spacing: .01em;
      transition: transform .16s ease, background .16s ease, border-color .16s ease;
    }
    .btn:hover {
      transform: translateY(-2px);
      background: #202020;
      border-color: rgba(255,255,255,.24);
    }
    .btn:active { transform: translateY(0); }
    .icon {
      width: 22px;
      height: 22px;
      flex: 0 0 22px;
      fill: currentColor;
    }
    .sub {
      margin-top: 22px;
      font-size: .82rem;
      color: #7f7f7f;
    }
    .sub strong { color: #aaa; font-weight: 600; }
  </style>
</head>
